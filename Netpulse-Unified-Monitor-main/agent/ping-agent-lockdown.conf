# Ping agent lock-down, part 2 (systemd drop-in). Installed by apply-ping-hardening.sh ONLY if ping still works with it.
# The agent can never gain extra privileges and holds no Linux capabilities at all.
# (Some systems need a file capability for "ping"; on those the script skips this part automatically.)
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
