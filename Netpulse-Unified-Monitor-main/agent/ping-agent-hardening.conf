# Ping agent lock-down, part 1 (systemd drop-in). Installed by apply-ping-hardening.sh.
#
# Goal: the agent may ping and talk to the app, and NOTHING else.
#  - the whole file system is READ-ONLY for the agent: it cannot create, change or delete any file
#  - home folders, /root and the web, share and mount folders are invisible to it
#  - it has its own private /tmp and a private /dev, and cannot see other users' processes
#  - it cannot change kernel settings, the clock, the host name or load modules
#  - it can only open normal network sockets (no raw packet sockets, no namespaces)
# A leading "-" in InaccessiblePaths means "ignore if the folder does not exist".
[Service]
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectProc=invisible
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
UMask=0077
InaccessiblePaths=-/var/www -/srv -/mnt -/media -/boot -/root -/home
