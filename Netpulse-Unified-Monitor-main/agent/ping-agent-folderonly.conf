# Ping agent lock-down, part 3: "its own folder only" (systemd drop-in). Installed by apply-ping-hardening.sh.
#
# The agent sees an EMPTY file system and only these read-only windows into the VM:
#   - its own folder /opt/ping-agent
#   - the system program files that Node.js and ping are stored in (/usr, and the /lib, /bin links to it).
#     It cannot run at all without them; they are read-only.
#   - a handful of system files for DNS and certificates (resolv.conf, hosts, nsswitch.conf, ssl certificates).
# Everything else (/home, /root, /var, /srv, /mnt, all other /opt and /etc files, the web server files, other users'
# data, logs, backups ...) does not exist for the agent. A leading "-" means "ignore if it does not exist".
[Service]
TemporaryFileSystem=/:ro
BindReadOnlyPaths=/usr
BindReadOnlyPaths=-/lib -/lib64 -/bin -/sbin
BindReadOnlyPaths=-/etc/ld.so.cache -/etc/ld.so.conf -/etc/ld.so.conf.d -/etc/nsswitch.conf -/etc/hosts -/etc/host.conf -/etc/resolv.conf -/etc/gai.conf -/etc/localtime -/etc/ssl -/etc/ca-certificates
BindReadOnlyPaths=/opt/ping-agent
